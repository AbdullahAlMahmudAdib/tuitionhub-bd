services:
  postgres:
    image: postgres:16-alpine
    container_name: tuitionhub-postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../database/init.sql:/docker-entrypoint-initdb.d/init.sql
    environment:
      POSTGRES_DB: tuitionhub
      POSTGRES_USER: tuitionhub
      POSTGRES_PASSWORD: ${DB_PASSWORD:-tuitionhub_dev}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tuitionhub"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: tuitionhub-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  ai-service:
    build:
      context: ..
      dockerfile: docker/Dockerfile.ai
    container_name: tuitionhub-ai
    ports:
      - "8000:8000"
    environment:
      REDIS_URL: redis://redis:6379/1
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
